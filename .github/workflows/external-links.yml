name: External link check
on:
  schedule:
    # Weekly Monday 06:00 UTC; separate from PR merge checks because public portals rate-limit CI runners.
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lychee:
    name: Verify external citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check external URLs in docs and evidence ledgers
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-file .lycheeignore
            './src/content/docs/**/*.md'
            './src/content/docs/**/*.mdx'
            './research/evidence/**/*.md'
          fail: true
          jobSummary: true
  freshness-audit:
    name: Citation freshness & browser queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit record freshness, deprecated URLs, and manual browser queue
        run: |
          set -o pipefail
          python3 scripts/verify-citations.py --offline --all --fail-on-stale | tee -a "$GITHUB_STEP_SUMMARY"
