name: Practitioner & Engineering Watcher
on:
  schedule:
    # Weekly on Monday at 03:00 UTC (08:30 IST)
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch-practitioners:
    name: Poll engineering feeds for research candidates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect practitioner candidates
        id: watcher
        run: |
          python3 scripts/watch-practitioners.py --json --output report.json --markdown-output report.md
          NEW_COUNT=$(python3 -c "import json; d=json.load(open('report.json')); print(d['new_count'])")
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          if [ "$NEW_COUNT" -gt 0 ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi

      - name: Open a candidate review issue
        if: steps.watcher.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BATCH_ID=$(python3 -c 'import hashlib,json; report=json.load(open("report.json")); links=sorted({row["link"] for row in report["new_items"]}); print(hashlib.sha256("\n".join(links).encode()).hexdigest()[:12])')
          TITLE="[PRACTITIONER INTAKE] Review engineering candidates ($BATCH_ID)"
          EXISTING=$(gh issue list --state all --search "$BATCH_ID in:title" --json title --jq '.[].title')
          if printf '%s\n' "$EXISTING" | grep -Fxq "$TITLE"; then
            echo "Candidate batch already recorded."
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --body-file report.md \
            --label "practitioner-alert"
