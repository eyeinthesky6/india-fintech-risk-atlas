name: Validate site
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
permissions:
  contents: read
concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review-scope:
    name: Identify content and publication changes
    runs-on: ubuntu-latest
    outputs:
      approval: ${{ steps.scope.outputs.approval }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the proposed merge with the base
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED=$(git diff --name-only --no-renames "$BASE_SHA" HEAD -- \
            src/content/ research/ public/ mcp/data/ src/taxonomy.json src/content.config.ts \
            src/components/ src/lib/ src/styles/ src/site-config.js astro.config.mjs \
            scripts/ .github/workflows/ .github/CODEOWNERS .githooks/ \
            docs/SECTION_WORKFLOW.md docs/RESEARCH_PROTOCOL.md docs/ATTESTATION_TEMPLATE.md \
            package.json package-lock.json)
          if [ -n "$CHANGED" ]; then
            echo 'approval=required' >> "$GITHUB_OUTPUT"
          else
            echo 'approval=unneeded' >> "$GITHUB_OUTPUT"
          fi
  content-approval:
    name: Maintainer approval for content and publication changes
    needs: review-scope
    if: needs.review-scope.outputs.approval == 'required' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    environment: atlas-content-approval
    permissions: {}
    steps:
      - run: echo 'Maintainer approved this pull request revision.'
  attestations:
    name: Content attestation
    needs: [review-scope, content-approval]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable maintainer approval
        env:
          SCOPE_RESULT: ${{ needs.review-scope.result }}
          APPROVAL_SCOPE: ${{ needs.review-scope.outputs.approval }}
          APPROVAL_RESULT: ${{ needs.content-approval.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$APPROVAL_SCOPE:$APPROVAL_RESULT" in
            required:success|unneeded:skipped) ;;
            *) echo 'Content and publication changes require maintainer approval for this PR revision.'; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - name: Check declarations, frontmatter parity, and evidence ledgers
        run: python3 scripts/check-attestations.py --all
      - name: Check citation parity, deprecated URLs, and freshness metadata
        run: python3 scripts/verify-citations.py --offline --all
      - name: Check Telegram summaries
        run: python3 scripts/test_telegram_update.py
  build:
    name: Site build & link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Parse workflow and issue-form YAML
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import { parse } from 'yaml';
          for (const dir of ['.github/workflows', '.github/ISSUE_TEMPLATE']) {
            for (const file of fs.readdirSync(dir).filter((name) => /\.ya?ml$/.test(name))) {
              parse(fs.readFileSync(`${dir}/${file}`, 'utf8'));
            }
          }
          EOF
      - run: npm run build
      - name: Check tracked exports are current
        run: git diff --exit-code --stat -- public/atlas-records.json public/llms.txt public/llms-full.txt mcp/data/atlas-records.json
      - run: npm ci --prefix mcp --no-audit --no-fund
      - run: npm test
      - name: Check public and bundled exports are identical
        run: |
          cmp public/atlas-records.json mcp/data/atlas-records.json
          cmp public/atlas-records.json dist/atlas-records.json
          cmp public/llms.txt dist/llms.txt
          cmp public/llms-full.txt dist/llms-full.txt
      - name: Verify the website and machine graph agree
        run: node scripts/check-graph-projections.js
      - name: Verify build output, Pagefind filters, and HTML internal links
        run: |
          test -f dist/index.html
          test -f dist/pagefind/pagefind.js
          test -f dist/upi/index.html
          test -f dist/upi/coverage/index.html
          python3 - <<'EOF'
          import pathlib, re, sys, urllib.parse
          dist = pathlib.Path("dist")
          base = "/india-fintech-risk-atlas"
          filters = sorted((dist / "pagefind" / "filter").glob("*.pf_filter"))
          if not filters:
              print("ERROR: Pagefind indexed 0 filters.", file=sys.stderr)
              sys.exit(1)
          print(f"Pagefind indexed {len(filters)} filter key(s).")
          errors = []
          for html in sorted(dist.rglob("*.html")):
              txt = html.read_text(encoding="utf-8", errors="ignore")
              for m in re.finditer(r'href="([^"]+)"', txt):
                  href = m.group(1)
                  if href.startswith(("http://", "https://", "mailto:", "tel:", "#", "data:")):
                      continue
                  path = urllib.parse.urlsplit(href).path
                  if not path:
                      continue
                  if path.startswith("/"):
                      if path != base and not path.startswith(base + "/"):
                          errors.append(f"{html.relative_to(dist)}: missing base prefix in {href}")
                          continue
                      rel = path[len(base):].lstrip("/")
                      ok = (dist / "index.html").is_file() if not rel else ((dist / rel).is_file() or (dist / rel / "index.html").is_file())
                      if not ok:
                          errors.append(f"{html.relative_to(dist)}: broken root link {href}")
                  else:
                      cand = (html.parent / path).resolve()
                      try:
                          cand.relative_to(dist.resolve())
                          ok = cand.is_file() or (cand / "index.html").is_file()
                      except ValueError:
                          ok = False
                      if not ok:
                          errors.append(f"{html.relative_to(dist)}: broken rel link {href}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("All built HTML internal links resolved cleanly.")
          EOF
