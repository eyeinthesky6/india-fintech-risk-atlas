name: Regulatory Watcher
on:
  schedule:
    # Once daily at 14:00 UTC (19:30 IST), right after regulators publish their evening circulars
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Poll regulatory feeds & triage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run regulatory feed watcher
        id: watcher
        run: |
          python3 scripts/watch-regulators.py --json --output report.json
          python3 scripts/watch-regulators.py --output report.md
          NEW_COUNT=$(python3 -c "import json; d=json.load(open('report.json')); print(d['new_count'])")
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          if [ "$NEW_COUNT" -gt 0 ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update triage issue
        if: steps.watcher.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          TITLE="[REGULATORY ALERT] New regulatory publication detected ($DATE)"
          # Check if an open issue with this title already exists
          EXISTING_ISSUE=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Issue #$EXISTING_ISSUE already exists for today. Adding comment..."
            gh issue comment "$EXISTING_ISSUE" --body-file report.md
          else
            echo "Creating new regulatory triage issue..."
            gh issue create \
              --title "$TITLE" \
              --body-file report.md \
              --label "regulatory-alert" || \
            gh issue create \
              --title "$TITLE" \
              --body-file report.md
          fi

      - name: Send Telegram Alert for New Circulars
        if: steps.watcher.outputs.has_new == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/notify-telegram.py \
            --title "⚠️ New Regulatory Publication Detected" \
            --message "Daily watcher detected ${{ steps.watcher.outputs.new_count }} new circular(s) from RBI / PIB." \
            --url "https://github.com/${{ github.repository }}/issues"
