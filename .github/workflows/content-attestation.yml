name: Content attestation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main for comparison
        run: git fetch origin main
      - name: Check declarations
        run: python3 scripts/check-attestations.py
