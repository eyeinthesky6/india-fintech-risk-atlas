name: Practitioner & Engineering Watcher
on:
  schedule:
    # Weekly on Monday at 03:00 UTC (08:30 IST)
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  watch-practitioners:
    name: Poll engineering feeds & auto-add
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run practitioner watcher preview
        id: watcher
        run: |
          python3 scripts/watch-practitioners.py --json --output report.json
          python3 scripts/watch-practitioners.py --output report.md
          NEW_COUNT=$(python3 -c "import json; d=json.load(open('report.json')); print(d['new_count'])")
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          if [ "$NEW_COUNT" -gt 0 ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-add new engineering observations
        if: steps.watcher.outputs.has_new == 'true'
        run: |
          python3 scripts/watch-practitioners.py --auto-add

      - name: Create pull request or alert issue
        if: steps.watcher.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          TITLE="[PRACTITIONER INTAKE] Discovered engineering observations ($DATE)"
          
          # Open triage issue for domain stewards
          gh issue create \
            --title "$TITLE" \
            --body-file report.md \
            --label "practitioner-alert" || \
          gh issue create \
            --title "$TITLE" \
            --body-file report.md
